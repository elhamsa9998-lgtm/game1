<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<title>فعالیت نگاره ۱ : به خانه ی ما خوش آمدی</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#fff8e8;color:#3f2b22}body{overflow:hidden}
.screen{display:none;width:100%;height:100vh}.screen.active{display:flex}
#start{align-items:center;justify-content:center;padding:18px;background:linear-gradient(145deg,#fff8d9,#dff6ff 55%,#e9ffd9)}
.start-card{width:min(92vw,650px);padding:30px 24px 24px;border:5px solid #f4b942;border-radius:34px;background:#fff;box-shadow:0 15px 35px #7b5b342b;text-align:center}
h1{font-size:clamp(25px,6vw,44px);line-height:1.45;margin:4px 0 20px;color:#e45a4f;font-weight:900}
.subtitle{font-size:clamp(16px,4vw,23px);font-weight:700;color:#5d7561;margin-bottom:22px}
.field{display:block;text-align:right;margin:14px 0}.field span{display:block;font-weight:800;margin:0 8px 7px}.field input{width:100%;padding:14px 16px;border:3px solid #a9d9c4;border-radius:17px;background:#fbfffd;font-size:18px;outline:none}
.start-btn,.restart{border:0;border-radius:20px;padding:15px 35px;font-size:21px;font-weight:900;cursor:pointer;background:linear-gradient(#ffcf55,#f3a82d);color:#57310e;box-shadow:0 6px 0 #c98520;margin-top:8px}
.designer{margin-top:22px;font-weight:800;color:#7b6b60;font-size:15px}
#game{flex-direction:column;background:#f9f1dc}.topbar{height:54px;min-height:54px;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#fff;border-bottom:3px solid #efd18a;gap:8px}
.title-mini{font-size:clamp(14px,3.8vw,21px);font-weight:900;color:#e15b4f;white-space:nowrap}.progress{font-size:14px;font-weight:800;background:#e9f7ef;border:2px solid #9fd6b7;border-radius:14px;padding:5px 10px;white-space:nowrap}
.stage{flex:1;min-height:0;display:flex;flex-direction:column}.main-photo-panel{flex:0 0 56%;min-height:0;background:#f2f7ee;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:5px solid #e9c46a;overflow:hidden}
.photo-holder{position:relative;touch-action:manipulation;display:inline-block;max-width:100%;max-height:100%;line-height:0}#mainImg{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
.hotspot{position:absolute;touch-action:manipulation;background:transparent;border:0;cursor:pointer;padding:0;border-radius:18px;outline:none}.hotspot:focus-visible{box-shadow:inset 0 0 0 4px #4da3ff}
.prompt-panel{flex:1;min-height:0;padding:8px 12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:linear-gradient(#fffdf6,#fff3d4)}
.prompt-text{font-size:clamp(17px,4.5vw,25px);font-weight:900;color:#68462d}.target-card{height:min(30vh,210px);width:min(82vw,320px);min-height:95px;background:#fff;border:4px solid #f1c95b;border-radius:22px;box-shadow:0 7px 18px #6b4d3b22;display:flex;align-items:center;justify-content:center;overflow:hidden}
#targetCanvas{max-width:100%;max-height:100%;display:block}.hint{font-size:13px;color:#8c7768;font-weight:700}#feedback{height:22px;font-size:14px;font-weight:900}.success{color:#25965b}.error{color:#d9574f}
#final{align-items:center;justify-content:center;padding:14px;background:linear-gradient(145deg,#eafff1,#fff6ce)}.final-card{width:min(94vw,700px);height:min(94vh,850px);background:#fff;border:5px solid #9bd8b6;border-radius:30px;padding:18px;box-shadow:0 15px 35px #536b4a2b;display:flex;flex-direction:column;align-items:center;overflow:auto}
.final-title{font-size:clamp(22px,6vw,34px);font-weight:900;color:#e35b50;margin:3px 0 4px}.final-sub{font-weight:800;color:#657a63;margin-bottom:8px}.face-card{width:min(72vw,330px);height:min(34vh,270px);min-height:145px;border:4px solid #f1c95b;border-radius:24px;background:#fff9e8;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:4px 0 10px}
#faceCanvas{max-width:100%;max-height:100%}.options{width:min(90vw,560px);display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:3px solid #a8d9c0;border-radius:18px;background:#f5fff9;padding:13px 8px;font-size:19px;font-weight:900;color:#355b48;cursor:pointer;box-shadow:0 4px 0 #8dbca5}.option:active{transform:translateY(3px);box-shadow:0 1px 0 #8dbca5}
.option.correct{background:#c9f7d7;border-color:#55b879}.option.wrong{background:#ffd8d4;border-color:#e16a60}.final-feedback{min-height:27px;font-weight:900;font-size:15px;margin:8px}
#finish{display:none;text-align:center;padding:24px}.trophy{font-size:65px}.finish-title{font-size:32px;color:#e25b4f;font-weight:900}.finish-text{font-size:18px;font-weight:800;line-height:2}
@media (max-height:650px){.main-photo-panel{flex-basis:51%}.target-card{height:24vh}}
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}.confetti-layer span{position:absolute;font-size:24px;animation:pop 800ms ease-out forwards}@keyframes pop{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) rotate(25deg) scale(1.2);opacity:0}}
</style>

let current=0,player='',teacher='',finalIndex=0;
const finalQuestions=[
{answer:'آزاده',options:['مادر','آزاده','بابا','امین']},
{answer:'مادر',options:['بابا','امین','آزاده','مادر']},
{answer:'بابا',options:['آزاده','مادر','بابا','امین']},
{answer:'امین',options:['امین','آزاده','مادر','بابا']}
];

function startGame(){
player=document.getElementById('playerName').value.trim()||'بازیکن';
teacher=document.getElementById('teacherName').value.trim()||'آموزگار';
document.getElementById('start').classList.remove('active');document.getElementById('game').classList.add('active');
current=0;buildQuestion();setTimeout(resizeHotspot,100);
}
function buildQuestion(){
const item=items[current];
document.getElementById('progress').textContent=(current+1)+' از '+items.length;
document.getElementById('promptText').textContent='«'+item.name+'» را در نگاره پیدا کن:';
document.getElementById('feedback').textContent='';document.getElementById('feedback').className='';
drawCrop(document.getElementById('targetCanvas'),item.crop,315,185);buildHotspot();
}

document.getElementById('photoHolder').addEventListener('click',function(){
const fb=document.getElementById('feedback');
fb.textContent='دوباره با دقت نگاه کن 👀';fb.className='error';
});
function buildHotspot(){
const holder=document.getElementById('photoHolder'),box=document.getElementById('hotspots');box.innerHTML='';
const item=items[current],b=item.hotspot,btn=document.createElement('button');btn.className='hotspot';btn.setAttribute('aria-label',item.name);
btn.onclick=function(e){e.stopPropagation();hitTarget(btn)};btn.dataset.x=b[0];btn.dataset.y=b[1];btn.dataset.w=b[2]-b[0];btn.dataset.h=b[3]-b[1];box.appendChild(btn);resizeHotspot();
}
function resizeHotspot(){
const img=document.getElementById('mainImg'),btn=document.querySelector('.hotspot');if(!btn||!img.naturalWidth)return;
const ir=img.getBoundingClientRect(),hr=document.getElementById('photoHolder').getBoundingClientRect(),sx=ir.width/img.naturalWidth,sy=ir.height/img.naturalHeight;
btn.style.left=((+btn.dataset.x*sx)+(ir.left-hr.left))+'px';btn.style.top=((+btn.dataset.y*sy)+(ir.top-hr.top))+'px';
btn.style.width=(+btn.dataset.w*sx)+'px';btn.style.height=(+btn.dataset.h*sy)+'px';
}
function burstConfetti(){
const layer=document.createElement('div');layer.className='confetti-layer';
for(let i=0;i<24;i++){const s=document.createElement('span');s.textContent=['⭐','✨','🎉'][i%3];s.style.left=(10+Math.random()*80)+'%';s.style.top=(25+Math.random()*20)+'%';s.style.animationDelay=(Math.random()*0.15)+'s';layer.appendChild(s)}
document.body.appendChild(layer);setTimeout(()=>layer.remove(),850);
}
function hitTarget(btn){
btn.classList.add('correct');document.getElementById('feedback').textContent='آفرین! درست پیدا کردی 🌟';document.getElementById('feedback').className='success';burstConfetti();
setTimeout(function(){if(current<items.length-1){current++;buildQuestion()}else{showFinal()}},700);
}
function drawCrop(canvas,crop,maxW,maxH){
const x=crop[0],y=crop[1],w=crop[2]-crop[0],h=crop[3]-crop[1],scale=Math.min(maxW/w,maxH/h);
canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
canvas.getContext('2d').drawImage(IMG,x,y,w,h,0,0,canvas.width,canvas.height);
}
function showFinal(){
document.getElementById('game').classList.remove('active');document.getElementById('final').classList.add('active');finalIndex=0;
document.getElementById('finish').style.display='none';document.querySelector('.face-card').style.display='flex';document.querySelector('.options').style.display='grid';document.querySelector('.final-sub').style.display='block';document.getElementById('finalFeedback').style.display='block';renderFinal();
}
function renderFinal(){
const q=finalQuestions[finalIndex];
const canvas=document.getElementById('faceCanvas'),ctx=canvas.getContext('2d'),im=new Image();
im.onload=function(){
const maxW=310,maxH=230,scale=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);
canvas.width=Math.max(1,Math.round(im.naturalWidth*scale));canvas.height=Math.max(1,Math.round(im.naturalHeight*scale));
ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height);
};
im.src=faces[q.answer];
const opt=document.getElementById('options');opt.innerHTML='';document.getElementById('finalFeedback').textContent='';
q.options.forEach(function(label){const b=document.createElement('button');b.className='option';b.textContent=label;b.onclick=function(){answerFinal(b,label,q.answer)};opt.appendChild(b)});
}
function answerFinal(btn,label,answer){
if(label===answer){
btn.classList.add('correct');document.getElementById('finalFeedback').textContent='آفرین! پاسخ درست است 🌟';document.getElementById('finalFeedback').style.color='#25965b';
setTimeout(function(){finalIndex++;if(finalIndex<finalQuestions.length)renderFinal();else finishGame()},650);
}else{
btn.classList.add('wrong');document.getElementById('finalFeedback').textContent='دوباره با دقت به تصویر نگاه کن 👀';document.getElementById('finalFeedback').style.color='#d9574f';
setTimeout(function(){btn.classList.remove('wrong')},450);
}}
function finishGame(){
document.querySelector('.face-card').style.display='none';document.querySelector('.options').style.display='none';document.querySelector('.final-sub').style.display='none';document.getElementById('finalFeedback').style.display='none';document.getElementById('finish').style.display='block';
document.getElementById('finishText').textContent=player+' جان، تو با موفقیت فعالیت نگاره ۱ را انجام دادی!';
}
function restartGame(){location.reload()}
IMG.onload=function(){resizeHotspot()};window.addEventListener('resize',function(){setTimeout(resizeHotspot,50)});
</script>
